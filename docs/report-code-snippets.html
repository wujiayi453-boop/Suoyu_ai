  <div class="label">关键代码 1：Hash 路由解析与状态读取（public/js/app.js）</div>
  <pre><span class="kw">function</span> <span class="fn">routeInfo</span>() {
  <span class="kw">const</span> raw = location.hash.slice(1) || <span class="str">'/'</span>;
  <span class="kw">const</span> [path, query = <span class="str">''</span>] = raw.split(<span class="str">'?'</span>);
  <span class="kw">return</span> { path: path || <span class="str">'/'</span>, params: <span class="kw">new</span> URLSearchParams(query) };
}
